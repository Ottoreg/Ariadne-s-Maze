<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#15151c" />
  <title>Ariadne's Maze — version autonome</title>
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%2315151c%22%2F%3E%0A%20%20%3C!--%20Labyrinthe%20stylis%C3%A9%20--%3E%0A%20%20%3Cg%20fill%3D%22none%22%20stroke%3D%22%232ec4b6%22%20stroke-width%3D%2222%22%20stroke-linecap%3D%22square%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M112%20112%20H400%20V400%20H144%20V168%20H344%20V344%20H200%20V224%20H288%20V288%20H240%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3C!--%20Corne%20du%20Minotaure%20--%3E%0A%20%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%2218%22%20fill%3D%22%23c0392b%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml" />
  <style>
/* style.css — HUD en surimpression pour un labyrinthe plein écran.
   Optimisé pour le mobile en mode paysage : vue principale = labyrinthe,
   déplacement en bas à gauche, action en bas à droite, panneaux en tiroir. */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0f0f16;
  --panel: #1b1b26;
  --panel-2: #232333;
  --text: #e8e8f0;
  --muted: #9a9ab0;
  --accent: #2ec4b6;
  --danger: #e74c3c;
  --border: #2c2c3c;
  /* Zones sûres (encoches / barres système en paysage). */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}

/* Flash rouge lors de la détection par le Minotaure. */
body.alert { background: #3a0f12; }

/* La vue principale occupe tout l'écran. */
#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  background: #15151c;
}

/* ---------- Bandeau haut (surimpression) ---------- */
#hud-top {
  position: absolute;
  top: calc(var(--safe-t) + 8px);
  left: calc(var(--safe-l) + 8px);
  right: calc(var(--safe-r) + 8px);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none; /* laisse passer le toucher sur le labyrinthe */
}
#hud-top > * { pointer-events: auto; }

#status {
  background: rgba(20, 20, 30, 0.72);
  backdrop-filter: blur(6px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 7px 10px;
  max-width: min(62vw, 360px);
}

.hp { display: flex; align-items: center; gap: 8px; }
.hp-bar {
  width: 120px;
  height: 12px;
  background: #101018;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
}
#hp-fill {
  height: 100%;
  width: 100%;
  background: #2ecc71;
  transition: width 0.2s, background 0.2s;
}
#hp-text { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  font-size: 11px;
  color: var(--muted);
  background: rgba(35, 35, 51, 0.7);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}
.chip b { color: var(--text); font-variant-numeric: tabular-nums; }
.chip.seed b { font-family: ui-monospace, monospace; font-size: 10px; }

#top-buttons { display: flex; gap: 6px; }
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(20, 20, 30, 0.72);
  backdrop-filter: blur(6px);
  color: var(--text);
  font-size: 19px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.12s, border-color 0.12s, transform 0.05s;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn.active { border-color: var(--accent); background: rgba(46, 196, 182, 0.22); }

/* ---------- Toasts d'événements ---------- */
#toasts {
  position: absolute;
  top: calc(var(--safe-t) + 74px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  pointer-events: none;
  width: max-content;
  max-width: 82vw;
}
.toast {
  background: rgba(20, 20, 30, 0.9);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 13px;
  line-height: 1.35;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  animation: toast-in 0.18s ease-out, toast-out 0.4s ease-in forwards;
  animation-delay: 0s, 2.6s;
  max-width: 82vw;
  text-align: center;
}
.toast.trap { border-left-color: #e07a5f; }
.toast.monster { border-left-color: #b5179e; }
.toast.treasure { border-left-color: #ffd166; }
.toast.danger { border-left-color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

/* ---------- Contrôles tactiles ---------- */
.controls {
  position: absolute;
  bottom: calc(var(--safe-b) + 14px);
  z-index: 5;
  touch-action: none;
}

/* Croix directionnelle — bas gauche. */
#dpad {
  left: calc(var(--safe-l) + 14px);
  width: 156px;
  height: 156px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 6px;
}
.ctrl-btn {
  border: 1px solid var(--border);
  background: rgba(35, 35, 51, 0.82);
  backdrop-filter: blur(4px);
  color: var(--text);
  border-radius: 14px;
  font-size: 20px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.08s, transform 0.05s;
}
.ctrl-btn:active { background: var(--accent); color: #0f0f16; transform: scale(0.94); }
.ctrl-btn.up { grid-column: 2; grid-row: 1; }
.ctrl-btn.left { grid-column: 1; grid-row: 2; }
.ctrl-btn.right { grid-column: 3; grid-row: 2; }
.ctrl-btn.down { grid-column: 2; grid-row: 3; }

/* Action — bas droite. */
#actions {
  right: calc(var(--safe-r) + 14px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}
.action-btn {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(46, 196, 182, 0.16);
  backdrop-filter: blur(4px);
  color: var(--text);
  cursor: pointer;
  display: grid;
  place-items: center;
  gap: 2px;
  transition: background 0.08s, transform 0.05s;
}
.action-btn:active { background: var(--accent); color: #0f0f16; transform: scale(0.94); }
.action-btn .glyph { font-size: 30px; line-height: 1; }
.action-btn .label { font-size: 11px; letter-spacing: 0.3px; }

/* ---------- Tiroir latéral (inventaire / journal / menu) ---------- */
#scrim {
  position: absolute;
  inset: 0;
  background: rgba(5, 5, 9, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 8;
}
#scrim.visible { opacity: 1; pointer-events: auto; }

#drawer {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  width: min(360px, 86vw);
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.22s ease;
  z-index: 9;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-t) + 10px) calc(var(--safe-r) + 14px) calc(var(--safe-b) + 14px) 14px;
}
#drawer.open { transform: translateX(0); }

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.drawer-header h2 { font-size: 17px; }
#drawer-close {
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
}
.drawer-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.inv-summary { margin-bottom: 10px; }
#inventory-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
#inventory-list li {
  font-size: 14px;
  padding: 8px 10px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
}
#inventory-list li.empty { color: var(--muted); font-style: italic; }

#log { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.5; }
.log-line { padding: 5px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.log-line:first-child { color: var(--accent); }

.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
.field input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  font-family: ui-monospace, monospace;
  font-size: 14px;
}
.menu-actions { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 16px; }
.menu-actions button {
  padding: 11px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
}
.menu-actions button:active { background: #2e2e42; }
#new-seed-btn { background: var(--accent); color: #0f0f16; border-color: transparent; font-weight: 600; }

.legend { border-top: 1px solid var(--border); padding-top: 12px; }
.legend h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 8px; }
.legend ul { list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
kbd {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 11px;
  font-family: ui-monospace, monospace;
}

/* ---------- Overlay de fin ---------- */
#overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(8, 8, 14, 0.78);
  backdrop-filter: blur(3px);
  z-index: 12;
}
#overlay.visible { display: flex; }
.overlay-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 26px 30px;
  text-align: center;
  max-width: 340px;
  margin: 16px;
}
.overlay-card h2 { margin-bottom: 10px; font-size: 23px; }
.overlay-card p { color: var(--muted); margin-bottom: 18px; }
.overlay-card button {
  padding: 12px 22px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #0f0f16;
  font-weight: 700;
  cursor: pointer;
  font-size: 15px;
}

/* ---------- Adaptations paysage court (mobile) ---------- */
@media (orientation: landscape) and (max-height: 480px) {
  #dpad { width: 132px; height: 132px; gap: 5px; }
  .ctrl-btn { font-size: 18px; border-radius: 12px; }
  .action-btn { width: 82px; height: 82px; }
  .action-btn .glyph { font-size: 26px; }
  .hp-bar { width: 96px; }
  #status { padding: 6px 8px; }
  .icon-btn { width: 38px; height: 38px; font-size: 17px; }
}

/* Très peu de hauteur : on masque le libellé de l'action pour gagner de la place. */
@media (orientation: landscape) and (max-height: 380px) {
  .action-btn .label { display: none; }
  .action-btn { width: 68px; height: 68px; }
}

/* ---------- Écran large (desktop) : contrôles un peu plus discrets ---------- */
@media (min-width: 900px) and (pointer: fine) {
  #dpad, #actions { opacity: 0.9; }
}

  </style>
</head>
<body>
<!-- La vue principale est le labyrinthe plein écran ; le HUD est en surimpression. -->
  <div id="app">
    <canvas id="game"></canvas>

    <!-- Bandeau haut : statut (gauche) + boutons de panneaux (droite) -->
    <div id="hud-top">
      <div id="status">
        <div class="hp">
          <div class="hp-bar"><div id="hp-fill"></div></div>
          <span id="hp-text">20 / 20</span>
        </div>
        <div class="chips">
          <span class="chip">💰 <b id="gold-text">0</b></span>
          <span class="chip">🕐 <b id="turn-text">0</b></span>
          <span class="chip seed">🌱 <b id="seed-label">-</b></span>
        </div>
      </div>
      <div id="top-buttons">
        <button class="icon-btn" data-panel="inventory" aria-label="Inventaire">🎒</button>
        <button class="icon-btn" data-panel="journal" aria-label="Journal">📜</button>
        <button class="icon-btn" data-panel="menu" aria-label="Menu">⚙️</button>
      </div>
    </div>

    <!-- Notifications d'événements sur la vue principale -->
    <div id="toasts"></div>

    <!-- Croix directionnelle (déplacement) — bas GAUCHE -->
    <div id="dpad" class="controls">
      <button data-dir="up" class="ctrl-btn up" aria-label="Haut">▲</button>
      <button data-dir="left" class="ctrl-btn left" aria-label="Gauche">◀</button>
      <button data-dir="right" class="ctrl-btn right" aria-label="Droite">▶</button>
      <button data-dir="down" class="ctrl-btn down" aria-label="Bas">▼</button>
    </div>

    <!-- Grappe d'action — bas DROITE -->
    <div id="actions" class="controls">
      <button id="wait-btn" class="action-btn" aria-label="Attendre un tour">
        <span class="glyph">⏳</span><span class="label">Attendre</span>
      </button>
    </div>

    <!-- Tiroir latéral : inventaire / journal / menu -->
    <div id="drawer">
      <div class="drawer-header">
        <h2 id="drawer-title">Inventaire</h2>
        <button id="drawer-close" aria-label="Fermer">✕</button>
      </div>
      <div class="drawer-body">
        <!-- Inventaire -->
        <section data-panel-content="inventory">
          <div class="inv-summary">
            <span class="chip">💰 <b id="gold-text-2">0</b> or</span>
          </div>
          <ul id="inventory-list"><li class="empty">Inventaire vide</li></ul>
        </section>

        <!-- Journal / historique des événements -->
        <section data-panel-content="journal" hidden>
          <div id="log"></div>
        </section>

        <!-- Menu : seed et parties -->
        <section data-panel-content="menu" hidden>
          <label class="field">
            <span>Seed du labyrinthe</span>
            <input id="seed-input" type="text" autocomplete="off" spellcheck="false" />
          </label>
          <div class="menu-actions">
            <button id="new-seed-btn">Générer cette seed</button>
            <button id="random-seed-btn">🎲 Seed aléatoire</button>
            <button id="restart-btn">↻ Recommencer le niveau</button>
          </div>
          <div class="legend">
            <h3>Légende</h3>
            <ul>
              <li><span class="dot" style="background:#2ec4b6"></span> Aventurier</li>
              <li><span class="dot" style="background:#c0392b"></span> Minotaure</li>
              <li><span class="dot" style="background:#ffd166"></span> Trésor</li>
              <li><span class="dot" style="background:#e07a5f"></span> Piège</li>
              <li><span class="dot" style="background:#b5179e"></span> Monstre</li>
              <li>⚑ Sortie · ⌂ Entrée</li>
            </ul>
            <p class="hint">Clavier : flèches · ZQSD · WASD · <kbd>Espace</kbd> pour attendre.</p>
          </div>
        </section>
      </div>
    </div>
    <div id="scrim"></div>

    <!-- Écran de fin (mort / victoire) -->
    <div id="overlay">
      <div class="overlay-card">
        <h2 id="overlay-title">Game Over</h2>
        <p id="overlay-text"></p>
        <button id="overlay-btn">Recommencer</button>
      </div>
    </div>
  </div>
  <script>
"use strict";
(function () {

// ===== rng.js =====
// rng.js — Générateur de nombres pseudo-aléatoires déterministe basé sur une seed.
// Tout l'aléatoire du jeu passe par ici pour que le labyrinthe et les événements
// soient reproductibles à partir d'une même seed.

// Hash une chaîne de caractères en un entier 32 bits (xmur3).
// Permet d'accepter une seed textuelle comme "ariane" ou "12345".
function hashSeed(str) {
  str = String(str);
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}

// Mulberry32 : un PRNG rapide et de bonne qualité pour un jeu.
// Retourne une fonction qui produit des flottants dans [0, 1).
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Classe pratique qui enveloppe un PRNG et fournit des helpers de jeu.
class RNG {
  constructor(seed) {
    this.seed = seed;
    const seeder = hashSeed(seed);
    this._next = mulberry32(seeder());
  }

  // Flottant dans [0, 1).
  float() {
    return this._next();
  }

  // Entier dans [min, max] inclus.
  int(min, max) {
    return Math.floor(this._next() * (max - min + 1)) + min;
  }

  // Retourne true avec la probabilité p (0..1).
  chance(p) {
    return this._next() < p;
  }

  // Choisit un élément au hasard dans un tableau.
  pick(arr) {
    return arr[Math.floor(this._next() * arr.length)];
  }

  // Choisit un élément selon des poids : entries = [[valeur, poids], ...].
  weighted(entries) {
    let total = 0;
    for (const [, w] of entries) total += w;
    let r = this._next() * total;
    for (const [value, w] of entries) {
      r -= w;
      if (r < 0) return value;
    }
    return entries[entries.length - 1][0];
  }
}

// PRNG déterministe pour UNE case précise (seed + coordonnées).
// Permet de calculer un événement stable par case sans stocker d'état,
// et sans consommer le flux principal du RNG.
function cellRandom(seed, x, y, salt = 0) {
  const seeder = hashSeed(`${seed}:${x}:${y}:${salt}`);
  return mulberry32(seeder());
}


// ===== maze.js =====
// maze.js — Génération du labyrinthe et des types de sol (terrains).
// Le labyrinthe est produit par un algorithme "recursive backtracker"
// (parcours en profondeur), entièrement déterministe grâce au RNG seedé.


// Types de cases du labyrinthe.
const TILE = {
  WALL: 0,
  FLOOR: 1,
};

// Types de sol (terrain) pour les cases praticables.
// Ils influencent la nature des événements des cases alentours.
const TERRAIN = {
  STONE: 'stone', // neutre
  GRASS: 'grass', // favorise les trésors / soins
  SAND: 'sand',   // favorise les monstres
  MUD: 'mud',     // favorise les pièges
  WATER: 'water', // calme, peu d'événements
};

const TERRAIN_LIST = [
  TERRAIN.STONE,
  TERRAIN.GRASS,
  TERRAIN.SAND,
  TERRAIN.MUD,
  TERRAIN.WATER,
];

// Génère un labyrinthe carré de taille impaire (murs sur les cases paires).
// Retourne un objet Maze avec la grille, les terrains, l'entrée et la sortie.
class Maze {
  constructor(seed, size = 21) {
    // Garantit une taille impaire pour l'algorithme de labyrinthe parfait.
    this.seed = seed;
    this.size = size % 2 === 0 ? size + 1 : size;
    this.rng = new RNG(`maze:${seed}`);
    this.grid = [];
    this.terrain = [];
    this.entrance = { x: 1, y: 1 };
    this.exit = { x: this.size - 2, y: this.size - 2 };
    this._generate();
    this._assignTerrain();
  }

  inBounds(x, y) {
    return x >= 0 && y >= 0 && x < this.size && y < this.size;
  }

  isWall(x, y) {
    if (!this.inBounds(x, y)) return true;
    return this.grid[y][x] === TILE.WALL;
  }

  isFloor(x, y) {
    return this.inBounds(x, y) && this.grid[y][x] === TILE.FLOOR;
  }

  terrainAt(x, y) {
    if (!this.inBounds(x, y)) return null;
    return this.terrain[y][x];
  }

  // Recursive backtracker : creuse des couloirs à partir de l'entrée.
  _generate() {
    const n = this.size;
    // Tout en mur au départ.
    this.grid = Array.from({ length: n }, () => new Array(n).fill(TILE.WALL));

    const start = this.entrance;
    this.grid[start.y][start.x] = TILE.FLOOR;

    const stack = [start];
    const dirs = [
      { dx: 0, dy: -2 },
      { dx: 2, dy: 0 },
      { dx: 0, dy: 2 },
      { dx: -2, dy: 0 },
    ];

    while (stack.length) {
      const cur = stack[stack.length - 1];
      // Voisins non visités à distance 2 (au-delà d'un mur).
      const neighbors = [];
      for (const d of dirs) {
        const nx = cur.x + d.dx;
        const ny = cur.y + d.dy;
        if (nx > 0 && ny > 0 && nx < n - 1 && ny < n - 1 && this.grid[ny][nx] === TILE.WALL) {
          neighbors.push({ nx, ny, wx: cur.x + d.dx / 2, wy: cur.y + d.dy / 2 });
        }
      }

      if (neighbors.length === 0) {
        stack.pop();
        continue;
      }

      const chosen = neighbors[this.rng.int(0, neighbors.length - 1)];
      // Perce le mur intermédiaire puis la case cible.
      this.grid[chosen.wy][chosen.wx] = TILE.FLOOR;
      this.grid[chosen.ny][chosen.nx] = TILE.FLOOR;
      stack.push({ x: chosen.nx, y: chosen.ny });
    }

    // Assure que la sortie est bien praticable.
    this.grid[this.exit.y][this.exit.x] = TILE.FLOOR;

    // Ajoute quelques boucles pour éviter un labyrinthe trop "parfait"
    // (rend le déplacement et la fuite face au Minotaure plus intéressants).
    const extra = Math.floor((n * n) / 40);
    for (let i = 0; i < extra; i++) {
      const x = this.rng.int(1, n - 2);
      const y = this.rng.int(1, n - 2);
      if (this.grid[y][x] === TILE.WALL) {
        // N'ouvre que si cela relie deux couloirs (évite les murs isolés).
        const openH = this.isFloor(x - 1, y) && this.isFloor(x + 1, y);
        const openV = this.isFloor(x, y - 1) && this.isFloor(x, y + 1);
        if (openH || openV) this.grid[y][x] = TILE.FLOOR;
      }
    }
  }

  // Attribue un terrain à chaque case praticable de façon déterministe.
  // On utilise un bruit par blocs pour créer des "zones" cohérentes plutôt
  // qu'un terrain totalement aléatoire case par case.
  _assignTerrain() {
    const n = this.size;
    this.terrain = Array.from({ length: n }, () => new Array(n).fill(null));
    const blockSize = 4; // taille des zones de terrain
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        if (this.grid[y][x] !== TILE.FLOOR) continue;
        const bx = Math.floor(x / blockSize);
        const by = Math.floor(y / blockSize);
        // Terrain de base de la zone.
        const zoneRoll = cellRandom(this.seed, bx, by, 7)();
        let t;
        if (zoneRoll < 0.4) t = TERRAIN.STONE;
        else if (zoneRoll < 0.6) t = TERRAIN.GRASS;
        else if (zoneRoll < 0.75) t = TERRAIN.SAND;
        else if (zoneRoll < 0.9) t = TERRAIN.MUD;
        else t = TERRAIN.WATER;

        // Petite variation locale pour casser l'uniformité des blocs.
        const localRoll = cellRandom(this.seed, x, y, 11)();
        if (localRoll < 0.12) {
          t = TERRAIN_LIST[Math.floor(cellRandom(this.seed, x, y, 13)() * TERRAIN_LIST.length)];
        }
        this.terrain[y][x] = t;
      }
    }
    // L'entrée est toujours un sol sûr et neutre.
    this.terrain[this.entrance.y][this.entrance.x] = TERRAIN.STONE;
  }

  // Liste toutes les cases praticables (utile pour placer joueur/minotaure).
  floorCells() {
    const cells = [];
    for (let y = 0; y < this.size; y++) {
      for (let x = 0; x < this.size; x++) {
        if (this.grid[y][x] === TILE.FLOOR) cells.push({ x, y });
      }
    }
    return cells;
  }
}


// ===== events.js =====
// events.js — Détermination des événements par case.
//
// Principe : l'événement d'une case dépend
//   1. de l'aléatoire (déterministe par seed + coordonnées),
//   2. du type de sol de la case,
//   3. des types de sol des 8 cases alentours (les 9 cases au total).
//
// On calcule un profil de terrain des 9 cases, on en déduit des poids
// pour chaque catégorie d'événement, puis on tire un événement stable
// pour la case (reproductible tant que la seed ne change pas).


// Catégories d'événements (base du jeu : quelques événements simples).
const EVENT = {
  NONE: 'none',
  TRAP: 'trap',
  MONSTER: 'monster',
  TREASURE: 'treasure',
};

// Influence de chaque terrain sur les poids des catégories.
// Chaque terrain "pousse" certaines catégories.
const TERRAIN_WEIGHTS = {
  [TERRAIN.STONE]: { none: 6, trap: 1, monster: 1, treasure: 1 },
  [TERRAIN.GRASS]: { none: 4, trap: 0.5, monster: 1, treasure: 3 },
  [TERRAIN.SAND]:  { none: 3, trap: 1, monster: 4, treasure: 1 },
  [TERRAIN.MUD]:   { none: 3, trap: 4, monster: 1, treasure: 0.5 },
  [TERRAIN.WATER]: { none: 7, trap: 0.5, monster: 0.5, treasure: 1 },
};

// Contenu concret de chaque catégorie d'événement.
// Le contenu précis (dégâts, butin) est lui aussi tiré de façon déterministe.
const MONSTERS = [
  { name: 'Rat des cavernes', dmg: [1, 2] },
  { name: 'Chauve-souris', dmg: [1, 3] },
  { name: 'Squelette errant', dmg: [2, 4] },
  { name: 'Araignée géante', dmg: [2, 5] },
];

const TRAPS = [
  { name: 'Pieux dissimulés', dmg: [1, 3] },
  { name: 'Dalle piégée', dmg: [2, 4] },
  { name: 'Nuage de spores', dmg: [1, 2] },
];

const TREASURES = [
  { name: 'Pièces d\'or', item: 'Pièces d\'or', gold: [3, 12] },
  { name: 'Potion de soin', item: 'Potion de soin', heal: [3, 6] },
  { name: 'Vieille clé', item: 'Vieille clé' },
  { name: 'Gemme scintillante', item: 'Gemme scintillante', gold: [8, 20] },
];

// Retourne le profil pondéré (somme des poids par catégorie) des 9 cases.
function neighborhoodWeights(maze, x, y) {
  const acc = { none: 0, trap: 0, monster: 0, treasure: 0 };
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const t = maze.terrainAt(x + dx, y + dy);
      // Une case-mur n'a pas de terrain : on la traite comme du STONE neutre,
      // ce qui rend les zones bordées de murs plus calmes.
      const weights = TERRAIN_WEIGHTS[t] || TERRAIN_WEIGHTS[TERRAIN.STONE];
      // La case centrale compte double : c'est le sol où l'on met le pied.
      const factor = dx === 0 && dy === 0 ? 2 : 1;
      acc.none += weights.none * factor;
      acc.trap += weights.trap * factor;
      acc.monster += weights.monster * factor;
      acc.treasure += weights.treasure * factor;
    }
  }
  return acc;
}

// Détermine l'événement d'une case (catégorie + détails).
// Déterministe : même seed + mêmes coordonnées => même événement.
function computeEvent(maze, x, y) {
  // Ni l'entrée, ni les murs ne portent d'événement.
  if (!maze.isFloor(x, y)) return { type: EVENT.NONE };
  if (x === maze.entrance.x && y === maze.entrance.y) return { type: EVENT.NONE };

  const w = neighborhoodWeights(maze, x, y);
  const rand = cellRandom(maze.seed, x, y, 101);

  const total = w.none + w.trap + w.monster + w.treasure;
  let r = rand() * total;
  let type = EVENT.NONE;
  if ((r -= w.none) < 0) type = EVENT.NONE;
  else if ((r -= w.trap) < 0) type = EVENT.TRAP;
  else if ((r -= w.monster) < 0) type = EVENT.MONSTER;
  else type = EVENT.TREASURE;

  return buildEventDetails(maze, x, y, type);
}

// Construit les détails concrets d'un événement de façon déterministe.
function buildEventDetails(maze, x, y, type) {
  const rand = cellRandom(maze.seed, x, y, 202);
  const pickIdx = (arr) => Math.floor(rand() * arr.length);
  const range = ([min, max]) => min + Math.floor(rand() * (max - min + 1));

  switch (type) {
    case EVENT.MONSTER: {
      const m = MONSTERS[pickIdx(MONSTERS)];
      return { type, name: m.name, damage: range(m.dmg) };
    }
    case EVENT.TRAP: {
      const t = TRAPS[pickIdx(TRAPS)];
      return { type, name: t.name, damage: range(t.dmg) };
    }
    case EVENT.TREASURE: {
      const t = TREASURES[pickIdx(TREASURES)];
      const out = { type, name: t.name, item: t.item };
      if (t.gold) out.gold = range(t.gold);
      if (t.heal) out.heal = range(t.heal);
      return out;
    }
    default:
      return { type: EVENT.NONE };
  }
}


// ===== player.js =====
// player.js — État de l'aventurier : position, points de vie, inventaire.

class Player {
  constructor(x, y, maxHp = 20) {
    this.x = x;
    this.y = y;
    this.maxHp = maxHp;
    this.hp = maxHp;
    this.gold = 0;
    // Inventaire simple : map nom d'objet -> quantité.
    this.inventory = new Map();
  }

  isAlive() {
    return this.hp > 0;
  }

  damage(amount) {
    this.hp = Math.max(0, this.hp - amount);
    return this.hp;
  }

  heal(amount) {
    this.hp = Math.min(this.maxHp, this.hp + amount);
    return this.hp;
  }

  addGold(amount) {
    this.gold += amount;
  }

  addItem(name, qty = 1) {
    this.inventory.set(name, (this.inventory.get(name) || 0) + qty);
  }

  // Retourne l'inventaire sous forme de liste triée pour l'affichage.
  items() {
    return Array.from(this.inventory.entries()).map(([name, qty]) => ({ name, qty }));
  }

  // Réinitialise l'état pour recommencer un niveau (position fournie par le jeu).
  reset(x, y) {
    this.x = x;
    this.y = y;
    this.hp = this.maxHp;
    this.gold = 0;
    this.inventory.clear();
  }
}


// ===== minotaur.js =====
// minotaur.js — Le Minotaure : ennemi mobile qui patrouille le labyrinthe.
//
// Comportement de base :
//   - S'il n'a pas repéré le joueur, il patrouille au hasard.
//   - S'il repère le joueur (dans son rayon de détection et à portée),
//     il le poursuit en se rapprochant case par case.
//   - Le contact avec le joueur inflige de gros dégâts.
//
// La première détection déclenche un drapeau (`hasDetectedPlayer`) qui pourra
// plus tard servir à reconfigurer le labyrinthe (fonctionnalité future).


class Minotaur {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.detectionRadius = 5; // portée de détection (distance de Manhattan)
    this.hasDetectedPlayer = false; // vrai dès la première détection
    this.chasing = false;
    this.contactDamage = [4, 8]; // dégâts au contact du joueur
  }

  // Distance de Manhattan jusqu'à un point.
  distanceTo(x, y) {
    return Math.abs(this.x - x) + Math.abs(this.y - y);
  }

  // Détecte le joueur s'il est assez proche. Renvoie true si première détection.
  senses(player) {
    const inRange = this.distanceTo(player.x, player.y) <= this.detectionRadius;
    this.chasing = inRange;
    if (inRange && !this.hasDetectedPlayer) {
      this.hasDetectedPlayer = true;
      return true; // première détection => à signaler
    }
    return false;
  }

  // Effectue un pas. `rng` est le RNG principal du jeu (déplacements aléatoires).
  // Renvoie l'événement produit ({ firstDetection, contact }).
  step(maze, player, rng) {
    const firstDetection = this.senses(player);

    let move;
    if (this.chasing) {
      move = this._chaseStep(maze, player);
    } else {
      move = this._wanderStep(maze, rng);
    }

    if (move) {
      this.x = move.x;
      this.y = move.y;
    }

    const contact = this.x === player.x && this.y === player.y;
    return { firstDetection, contact };
  }

  // Renvoie les cases praticables adjacentes.
  _freeNeighbors(maze) {
    const dirs = [
      { x: this.x, y: this.y - 1 },
      { x: this.x + 1, y: this.y },
      { x: this.x, y: this.y + 1 },
      { x: this.x - 1, y: this.y },
    ];
    return dirs.filter((c) => maze.isFloor(c.x, c.y));
  }

  // Poursuite : choisit la case adjacente qui réduit la distance au joueur.
  _chaseStep(maze, player) {
    const options = this._freeNeighbors(maze);
    if (options.length === 0) return null;
    let best = null;
    let bestDist = Infinity;
    for (const c of options) {
      const d = Math.abs(c.x - player.x) + Math.abs(c.y - player.y);
      if (d < bestDist) {
        bestDist = d;
        best = c;
      }
    }
    return best;
  }

  // Errance : déplacement aléatoire, en évitant de faire du surplace.
  _wanderStep(maze, rng) {
    const options = this._freeNeighbors(maze);
    if (options.length === 0) return null;
    return options[rng.int(0, options.length - 1)];
  }
}


// ===== render.js =====
// render.js — Rendu du jeu sur un canvas 2D en vue de dessus (topdown).
// Une caméra suit le joueur. Les cases déjà visitées sont mémorisées pour
// dessiner un léger "brouillard" sur les zones non explorées.


const TILE_SIZE = 40; // taille d'une case en pixels

// Palette de couleurs par terrain.
const TERRAIN_COLORS = {
  [TERRAIN.STONE]: '#6b7280',
  [TERRAIN.GRASS]: '#4d7c4d',
  [TERRAIN.SAND]: '#c2a56b',
  [TERRAIN.MUD]: '#6b5334',
  [TERRAIN.WATER]: '#3b6ea5',
};

const WALL_COLOR = '#2a2a35';
const WALL_TOP = '#3a3a48';

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.tileSize = TILE_SIZE;
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    // Adapte le canvas à son conteneur avec la densité de pixels de l'écran.
    const rect = this.canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = Math.floor(rect.width * dpr);
    this.canvas.height = Math.floor(rect.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.viewW = rect.width;
    this.viewH = rect.height;
  }

  // Dessine une frame complète.
  draw(game) {
    const ctx = this.ctx;
    const ts = this.tileSize;
    const maze = game.maze;
    const player = game.player;

    // Caméra centrée sur le joueur.
    const camX = player.x * ts + ts / 2 - this.viewW / 2;
    const camY = player.y * ts + ts / 2 - this.viewH / 2;

    ctx.clearRect(0, 0, this.viewW, this.viewH);
    ctx.fillStyle = '#15151c';
    ctx.fillRect(0, 0, this.viewW, this.viewH);

    // Détermine la plage de cases visibles pour ne dessiner que le nécessaire.
    const startCol = Math.max(0, Math.floor(camX / ts));
    const endCol = Math.min(maze.size - 1, Math.ceil((camX + this.viewW) / ts));
    const startRow = Math.max(0, Math.floor(camY / ts));
    const endRow = Math.min(maze.size - 1, Math.ceil((camY + this.viewH) / ts));

    for (let y = startRow; y <= endRow; y++) {
      for (let x = startCol; x <= endCol; x++) {
        const sx = Math.round(x * ts - camX);
        const sy = Math.round(y * ts - camY);
        const visited = game.visited[y][x];

        if (maze.grid[y][x] === TILE.WALL) {
          ctx.fillStyle = WALL_COLOR;
          ctx.fillRect(sx, sy, ts, ts);
          ctx.fillStyle = WALL_TOP;
          ctx.fillRect(sx, sy, ts, 4);
        } else {
          const terrain = maze.terrainAt(x, y);
          ctx.fillStyle = TERRAIN_COLORS[terrain] || '#555';
          ctx.fillRect(sx, sy, ts, ts);
          // Léger quadrillage.
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.strokeRect(sx + 0.5, sy + 0.5, ts - 1, ts - 1);

          // Marqueur d'événement révélé sur les cases déjà visitées.
          const ev = game.revealedEvents.get(`${x},${y}`);
          if (ev && ev.type !== EVENT.NONE) {
            this._drawEventMarker(ctx, sx, sy, ts, ev);
          }
        }

        // Entrée et sortie.
        if (x === maze.entrance.x && y === maze.entrance.y) {
          this._drawGlyph(ctx, sx, sy, ts, '⌂', '#e8e8f0');
        }
        if (x === maze.exit.x && y === maze.exit.y) {
          this._drawGlyph(ctx, sx, sy, ts, '⚑', '#ffe066');
        }

        // Brouillard sur les cases non encore visitées.
        if (!visited) {
          ctx.fillStyle = 'rgba(6,6,10,0.55)';
          ctx.fillRect(sx, sy, ts, ts);
        }
      }
    }

    // Minotaure (dessiné seulement s'il a déjà été aperçu).
    const mino = game.minotaur;
    if (game.visited[mino.y][mino.x] || mino.chasing) {
      this._drawEntity(ctx, mino.x, mino.y, ts, camX, camY, '#c0392b', '🐂');
    }

    // Joueur.
    this._drawEntity(ctx, player.x, player.y, ts, camX, camY, '#2ec4b6', '🗡');
  }

  _drawEntity(ctx, x, y, ts, camX, camY, color, glyph) {
    const sx = Math.round(x * ts - camX);
    const sy = Math.round(y * ts - camY);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx + ts / 2, sy + ts / 2, ts * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = `${Math.floor(ts * 0.5)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(glyph, sx + ts / 2, sy + ts / 2 + 1);
  }

  _drawEventMarker(ctx, sx, sy, ts, ev) {
    const colors = {
      [EVENT.TRAP]: '#e07a5f',
      [EVENT.MONSTER]: '#b5179e',
      [EVENT.TREASURE]: '#ffd166',
    };
    ctx.fillStyle = colors[ev.type] || '#fff';
    ctx.beginPath();
    ctx.arc(sx + ts / 2, sy + ts / 2, ts * 0.14, 0, Math.PI * 2);
    ctx.fill();
  }

  _drawGlyph(ctx, sx, sy, ts, glyph, color) {
    ctx.fillStyle = color;
    ctx.font = `${Math.floor(ts * 0.6)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(glyph, sx + ts / 2, sy + ts / 2 + 1);
  }
}


// ===== game.js =====
// game.js — Contrôleur principal du jeu.
// Gère l'état, les tours (déplacement joueur puis Minotaure), les événements,
// les points de vie, la mort/relance de niveau et l'inventaire.


class Game {
  constructor(seed, size = 21) {
    this.size = size;
    this.listeners = {};
    this.load(seed);
  }

  // (Re)charge un niveau à partir d'une seed.
  load(seed) {
    this.seed = String(seed);
    this.maze = new Maze(this.seed, this.size);
    this.rng = new RNG(`play:${this.seed}`); // RNG des déplacements du Minotaure

    const start = this.maze.entrance;
    this.player = new Player(start.x, start.y);

    // Place le Minotaure loin du joueur (vers la sortie).
    const mstart = this._farStart(start);
    this.minotaur = new Minotaur(mstart.x, mstart.y);

    // Cases explorées et événements déjà révélés.
    this.visited = Array.from({ length: this.maze.size }, () =>
      new Array(this.maze.size).fill(false)
    );
    this.revealedEvents = new Map();
    this.resolvedCells = new Set(); // cases dont l'événement est déjà déclenché

    this.turn = 0;
    this.over = false;
    this.won = false;
    this.mazeShifted = false;

    this._reveal(this.player.x, this.player.y);
    this._resolveEvent(this.player.x, this.player.y, true); // entrée = sûre
    this.emit('log', `Bienvenue dans le labyrinthe (seed : ${this.seed}). Trouve la sortie ⚑ !`);
    this.emit('update');
  }

  // Recommence le niveau courant (même seed).
  restart() {
    this.load(this.seed);
  }

  // Trouve une case praticable éloignée de `from` pour y placer le Minotaure.
  _farStart(from) {
    const cells = this.maze.floorCells();
    let best = this.maze.exit;
    let bestDist = -1;
    for (const c of cells) {
      const d = Math.abs(c.x - from.x) + Math.abs(c.y - from.y);
      if (d > bestDist) {
        bestDist = d;
        best = c;
      }
    }
    return best;
  }

  // --- Système d'événements minimal (émetteur) ---
  on(event, fn) {
    (this.listeners[event] = this.listeners[event] || []).push(fn);
  }
  emit(event, payload) {
    (this.listeners[event] || []).forEach((fn) => fn(payload));
  }

  // Déplacement du joueur d'une case. dir ∈ {up,down,left,right}.
  move(dir) {
    if (this.over) return;
    const deltas = {
      up: { dx: 0, dy: -1 },
      down: { dx: 0, dy: 1 },
      left: { dx: -1, dy: 0 },
      right: { dx: 1, dy: 0 },
    };
    const d = deltas[dir];
    if (!d) return;

    const nx = this.player.x + d.dx;
    const ny = this.player.y + d.dy;
    if (this.maze.grid[ny] === undefined || this.maze.grid[ny][nx] === undefined) return;
    if (this.maze.grid[ny][nx] === TILE.WALL) {
      return; // mur : déplacement impossible
    }

    this.player.x = nx;
    this.player.y = ny;
    this.turn++;
    this._reveal(nx, ny);

    // Résout l'événement de la case d'arrivée.
    this._resolveEvent(nx, ny);

    // Victoire : atteinte de la sortie.
    if (nx === this.maze.exit.x && ny === this.maze.exit.y && !this.over) {
      this.won = true;
      this.over = true;
      this.emit('log', '🎉 Tu as trouvé la sortie ! Niveau terminé.');
      this.emit('gameover', { won: true });
      this.emit('update');
      return;
    }

    // Tour du Minotaure.
    if (!this.over) this._minotaurTurn();

    this.emit('update');
  }

  // Action « Attendre » : passe un tour sans bouger.
  // Le Minotaure, lui, se déplace : utile tactiquement (le laisser passer,
  // guetter, etc.). Sert de bouton d'action principal sur mobile.
  wait() {
    if (this.over) return;
    this.turn++;
    this.emit('log', '⏳ Tu attends, aux aguets...');
    this._minotaurTurn();
    this.emit('update');
  }

  // Révèle la case et ses voisines immédiates (petit champ de vision).
  _reveal(x, y) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const vx = x + dx;
        const vy = y + dy;
        if (this.maze.inBounds(vx, vy)) this.visited[vy][vx] = true;
      }
    }
  }

  // Déclenche l'événement de la case (une seule fois par case).
  _resolveEvent(x, y, silent = false) {
    const key = `${x},${y}`;
    if (this.resolvedCells.has(key)) return;
    this.resolvedCells.add(key);

    const ev = computeEvent(this.maze, x, y);
    if (ev.type !== EVENT.NONE) this.revealedEvents.set(key, ev);
    if (silent || ev.type === EVENT.NONE) return;

    switch (ev.type) {
      case EVENT.TRAP: {
        this.player.damage(ev.damage);
        this.emit('log', `⚠️ Piège : ${ev.name} ! Tu perds ${ev.damage} PV.`);
        break;
      }
      case EVENT.MONSTER: {
        this.player.damage(ev.damage);
        this.emit('log', `⚔️ Rencontre : ${ev.name} t'inflige ${ev.damage} PV de dégâts.`);
        break;
      }
      case EVENT.TREASURE: {
        this.player.addItem(ev.item);
        let msg = `💰 Trésor : ${ev.name}`;
        if (ev.gold) {
          this.player.addGold(ev.gold);
          msg += ` (+${ev.gold} or)`;
        }
        if (ev.heal) {
          this.player.heal(ev.heal);
          msg += ` (+${ev.heal} PV)`;
        }
        this.emit('log', msg + ' !');
        break;
      }
    }

    this._checkDeath();
  }

  // Fait jouer le Minotaure et gère la détection / le contact.
  _minotaurTurn() {
    const res = this.minotaur.step(this.maze, this.player, this.rng);

    if (res.firstDetection) {
      this.emit('log', '👁️ Le Minotaure a flairé ta présence... Il te poursuit !');
      this._onFirstDetection();
    }

    if (res.contact) {
      const [min, max] = this.minotaur.contactDamage;
      const dmg = this.rng.int(min, max);
      this.player.damage(dmg);
      this.emit('log', `🐂 Le Minotaure te charge ! Tu perds ${dmg} PV.`);
      this._checkDeath();
    }
  }

  // Crochet déclenché à la toute première détection par le Minotaure.
  // (Fonctionnalité future : reconfiguration du labyrinthe. Ici, simple signal.)
  _onFirstDetection() {
    this.mazeShifted = false; // prêt à être activé plus tard
    this.emit('detected');
  }

  _checkDeath() {
    if (!this.player.isAlive() && !this.over) {
      this.over = true;
      this.emit('log', '💀 Tu es mort. Le niveau recommence...');
      this.emit('gameover', { won: false });
    }
  }
}


// ===== main.js =====
// main.js — Point d'entrée : relie le jeu au DOM (canvas plein écran, HUD en
// surimpression, tiroirs, contrôles tactiles pensés pour le mobile paysage).


const $ = (id) => document.getElementById(id);

const canvas = $('game');
const renderer = new Renderer(canvas);

// Éléments du HUD.
const hpFill = $('hp-fill');
const hpText = $('hp-text');
const goldText = $('gold-text');
const goldText2 = $('gold-text-2');
const turnText = $('turn-text');
const invList = $('inventory-list');
const logEl = $('log');
const toastsEl = $('toasts');
const seedInput = $('seed-input');
const seedLabel = $('seed-label');
const overlay = $('overlay');
const overlayTitle = $('overlay-title');
const overlayText = $('overlay-text');
const overlayBtn = $('overlay-btn');
const drawer = $('drawer');
const drawerTitle = $('drawer-title');
const scrim = $('scrim');

// Seed initiale : ?seed=... dans l'URL, sinon aléatoire.
const urlSeed = new URLSearchParams(location.search).get('seed');
let currentSeed = urlSeed || randomSeed();
seedInput.value = currentSeed;

const game = new Game(currentSeed);
wireGame(game);

// --- Boucle de rendu ---
function loop() {
  renderer.draw(game);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// --- Liaison des événements du jeu à l'interface ---
function wireGame(g) {
  seedLabel.textContent = g.seed;
  g.on('log', (msg) => addLog(msg));
  g.on('update', () => updateHud(g));
  g.on('detected', () => flashDetection());
  g.on('gameover', ({ won }) => showOverlay(g, won));
  updateHud(g);
}

function updateHud(g) {
  const p = g.player;
  const pct = Math.max(0, (p.hp / p.maxHp) * 100);
  hpFill.style.width = pct + '%';
  hpFill.style.background = pct > 50 ? '#2ecc71' : pct > 25 ? '#f1c40f' : '#e74c3c';
  hpText.textContent = `${p.hp} / ${p.maxHp}`;
  goldText.textContent = p.gold;
  if (goldText2) goldText2.textContent = p.gold;
  turnText.textContent = g.turn;

  invList.innerHTML = '';
  const items = p.items();
  if (items.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'Inventaire vide';
    invList.appendChild(li);
  } else {
    for (const it of items) {
      const li = document.createElement('li');
      li.textContent = it.qty > 1 ? `${it.name} ×${it.qty}` : it.name;
      invList.appendChild(li);
    }
  }
}

// Classe le message selon son contenu pour colorer le toast et le journal.
function classifyLog(msg) {
  if (msg.includes('Piège')) return EVENT.TRAP;
  if (msg.includes('Rencontre')) return EVENT.MONSTER;
  if (msg.includes('Trésor')) return EVENT.TREASURE;
  if (msg.includes('Minotaure') || msg.includes('mort')) return 'danger';
  return '';
}

function addLog(msg) {
  // Journal complet (historique).
  const line = document.createElement('div');
  line.className = 'log-line';
  line.textContent = msg;
  logEl.insertBefore(line, logEl.firstChild); // plus récent en haut
  while (logEl.children.length > 60) logEl.removeChild(logEl.lastChild);

  // Toast éphémère sur la vue principale.
  showToast(msg, classifyLog(msg));
}

function showToast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  toastsEl.appendChild(t);
  // Retire après la fin de l'animation de sortie.
  setTimeout(() => t.remove(), 3100);
  // Ne garde que les 3 derniers toasts affichés.
  while (toastsEl.children.length > 3) toastsEl.firstChild.remove();
}

function flashDetection() {
  document.body.classList.add('alert');
  setTimeout(() => document.body.classList.remove('alert'), 600);
}

function showOverlay(g, won) {
  overlayTitle.textContent = won ? 'Niveau terminé 🎉' : 'Game Over 💀';
  overlayText.textContent = won
    ? `Sortie atteinte en ${g.turn} tours avec ${g.player.gold} or.`
    : 'Le labyrinthe a eu raison de toi.';
  overlayBtn.textContent = won ? 'Nouveau labyrinthe' : 'Recommencer';
  overlay.dataset.won = won ? '1' : '0';
  overlay.classList.add('visible');
}

overlayBtn.addEventListener('click', () => {
  overlay.classList.remove('visible');
  logEl.innerHTML = '';
  if (overlay.dataset.won === '1') {
    currentSeed = randomSeed();
    seedInput.value = currentSeed;
    game.load(currentSeed);
    seedLabel.textContent = game.seed;
  } else {
    game.restart();
  }
});

// ---------- Tiroir (inventaire / journal / menu) ----------
const PANEL_TITLES = { inventory: 'Inventaire', journal: 'Journal des événements', menu: 'Menu' };
let openPanel = null;

function showPanel(name) {
  openPanel = name;
  drawerTitle.textContent = PANEL_TITLES[name] || '';
  drawer.querySelectorAll('[data-panel-content]').forEach((el) => {
    el.hidden = el.dataset.panelContent !== name;
  });
  drawer.classList.add('open');
  scrim.classList.add('visible');
  document.querySelectorAll('[data-panel]').forEach((b) =>
    b.classList.toggle('active', b.dataset.panel === name)
  );
}

function closePanel() {
  openPanel = null;
  drawer.classList.remove('open');
  scrim.classList.remove('visible');
  document.querySelectorAll('[data-panel]').forEach((b) => b.classList.remove('active'));
}

document.querySelectorAll('[data-panel]').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (openPanel === btn.dataset.panel) closePanel();
    else showPanel(btn.dataset.panel);
  });
});
$('drawer-close').addEventListener('click', closePanel);
scrim.addEventListener('click', closePanel);

// ---------- Contrôles clavier ----------
const KEY_DIRS = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  z: 'up', q: 'left', // AZERTY
};
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openPanel) { closePanel(); return; }
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); game.wait(); return; }
  const dir = KEY_DIRS[e.key];
  if (dir) { e.preventDefault(); game.move(dir); }
});

// ---------- Contrôles tactiles avec répétition au maintien ----------
// Chaque bouton déclenche l'action au contact, puis la répète tant qu'on
// maintient le doigt appuyé (confort de jeu sur mobile).
function bindHold(el, action) {
  let timer = null;
  let repeat = null;
  const start = (e) => {
    e.preventDefault();
    if (game.over) return;
    action();
    // Délai avant répétition, puis cadence régulière.
    timer = setTimeout(() => {
      repeat = setInterval(action, 150);
    }, 320);
  };
  const stop = () => {
    clearTimeout(timer);
    clearInterval(repeat);
    timer = repeat = null;
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
  // Évite le menu contextuel sur appui long mobile.
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

document.querySelectorAll('[data-dir]').forEach((btn) => {
  bindHold(btn, () => game.move(btn.dataset.dir));
});
bindHold($('wait-btn'), () => game.wait());

// ---------- Menu : seed et parties ----------
function reloadWith(seed) {
  currentSeed = seed;
  seedInput.value = seed;
  logEl.innerHTML = '';
  toastsEl.innerHTML = '';
  overlay.classList.remove('visible');
  game.load(seed);
  seedLabel.textContent = game.seed;
  closePanel();
}
$('new-seed-btn').addEventListener('click', () => reloadWith(seedInput.value.trim() || randomSeed()));
$('random-seed-btn').addEventListener('click', () => reloadWith(randomSeed()));
$('restart-btn').addEventListener('click', () => {
  logEl.innerHTML = '';
  toastsEl.innerHTML = '';
  overlay.classList.remove('visible');
  game.restart();
  closePanel();
});

function randomSeed() {
  const words = ['ariane', 'dedale', 'thesee', 'minos', 'crete', 'fil', 'corne', 'ombre'];
  const w = words[Math.floor(Math.random() * words.length)];
  return `${w}-${Math.floor(Math.random() * 100000)}`;
}

// ---------- Service worker (PWA) ----------
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}


})();
  </script>
</body>
